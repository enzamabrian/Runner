name: VPS Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # Clean previous repo state on runner
      - name: Clean Workspace
        run: |
          echo "Cleaning workspace..."
          git reset --hard || true
          git clean -fd || true

      # Checkout latest code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: true

      # Show latest commit (debug)
      - name: Show Latest Commit
        run: |
          echo "Latest commit deployed:"
          git log -1

      # Backup existing Docker apps
      - name: Backup Apps
        run: |
          DEPLOY_DIR="/home/github-runner/apps"
          BACKUP_DIR="/home/github-runner/backups"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")

          mkdir -p $BACKUP_DIR

          for APP in backend frontend; do
            SRC="$DEPLOY_DIR/$APP"
            if [ -d "$SRC" ]; then
              cp -r "$SRC" "$BACKUP_DIR/${APP}_$TIMESTAMP"
              echo "✅ Backed up $APP to $BACKUP_DIR/${APP}_$TIMESTAMP"
            else
              echo "⚠️ $APP folder not found, skipping backup"
            fi
          done

      # Sync latest code to VPS apps folder
      - name: Sync Code to Apps Folder
        run: |
          DEPLOY_DIR="/home/github-runner/apps"
          mkdir -p $DEPLOY_DIR
          rsync -av --delete $GITHUB_WORKSPACE/ $DEPLOY_DIR/

      # Deploy Backend with Docker
      - name: Deploy Backend Docker
        run: |
          DEPLOY_DIR="/home/github-runner/apps/backend"
          cd $DEPLOY_DIR
          echo "Building and starting backend container..."
          docker compose down
          docker compose build
          docker compose up -d
          echo "✅ Backend Docker deployed"

      # Deploy Frontend with Docker
      - name: Deploy Frontend Docker
        run: |
          DEPLOY_DIR="/home/github-runner/apps/frontend"
          cd $DEPLOY_DIR
          echo "Building and starting frontend container..."
          docker compose down
          docker compose build
          docker compose up -d
          echo "✅ Frontend Docker deployed"

      - name: Deployment Completed
        run: echo "🎉 VPS Deployment completed successfully!" explain this line by line