version: "3.9"

services:

  backend:
    container_name: backend-app
    build:
      context: ./backend
    ports:
      - "5000:3000"
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - app-network

  frontend:
    container_name: frontend-app
    build:
      context: ./frontend
    ports:
      - "5001:80"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge