version: "3.9"

services:
  backend:
    container_name: backend-app
    build:
      context: ./backend
    ports:
      - "5000:3000"
    restart: always
    env_file:
      - ./.env
    depends_on:
      - mysql
    networks:
      - app-network

  frontend:
    container_name: frontend-app
    build:
      context: ./frontend
    ports:
      - "5001:80"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: student-mysql
    restart: always
    env_file:
      - ./.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge